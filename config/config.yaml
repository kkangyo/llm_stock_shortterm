# 뉴스 수집 및 LLM 파이프라인 설정
# 증권사 연동(매매)은 이 단계에서 다루지 않는다.

market_hours:
  timezone: "Asia/Seoul"
  # 장 시작/종료 (동시호가 포함 여유있게 잡음)
  start: "09:00"
  end: "15:30"
  # 주말 제외 여부
  weekdays_only: true

polling:
  # 뉴스 수집 주기 (초)
  interval_seconds: 30

news_sources:
  # RSS 피드 목록. 동작 확인된 항목만 우선 등록, 나머지는 필요시 추가/검증 후 주석 해제
  rss_feeds:
    - name: "한국경제 - 경제"
      url: "https://www.hankyung.com/feed/economy"
    - name: "한국경제 - 증권"
      url: "https://www.hankyung.com/feed/finance"
    # - name: "연합뉴스 - 경제"
    #   url: "https://www.yna.co.kr/rss/economy.xml"
    # - name: "매일경제 - 증권"
    #   url: "https://www.mk.co.kr/rss/30000001/"

  # 발행된 지 이 시간(분)이 지난 뉴스는 처리 대상에서 제외한다.
  # 단타 매매는 신선도가 생명이라 오래된 뉴스는 걸러낸다.
  max_age_minutes: 120

  # 같은 뉴스 재수집 방지를 위해 최근 N개의 기사 URL/제목 해시를 메모리에 유지
  # (프로세스가 살아있는 동안의 러닝 윈도우 - 아래 dedup_lookback_days와는 별개)
  dedup_cache_size: 500

  # 프로세스가 재시작되면 위 메모리 캐시는 초기화되는데, RSS는 보통 최근 기사를 다시
  # 나열하므로 그대로 두면 이미 처리한 뉴스를 "신규"로 오인해 Ollama/Claude를 중복 호출한다.
  # 시작 시 DB에서 최근 N일치 news_id를 불러와 스킵 대상으로 미리 등록해서 방지한다.
  dedup_lookback_days: 2

local_filter:
  # 1차 필터(뉴스 관련성/감성 스크리닝)에 사용할 로컬 LLM 백엔드.
  # - "ollama": CPU에서 Ollama 서버로 추론. 설치/운영이 가장 쉽지만 이 PC(Intel Core
  #   Ultra + Arc iGPU + AI Boost NPU)에서는 GPU/NPU를 전혀 쓰지 않는다.
  # - "openvino": OpenVINO GenAI로 Intel Arc iGPU 또는 AI Boost NPU를 직접 사용해 추론.
  #   먼저 `pip install -r requirements-openvino.txt` 후
  #   `python scripts/download_openvino_model.py`로 모델을 받아둬야 한다.
  backend: "openvino"

ollama:
  host: "http://localhost:11434"
  # qwen2.5:7b - 다국어/한국어 인식이 llama3.1:8b보다 좋고 속도도 비슷해서 기본값으로 채택.
  # 다른 모델로 바꾸려면 `ollama pull <모델명>` 후 이 값만 변경하면 됨.
  model: "qwen2.5:7b"
  # 1차 필터 판단 제한시간(초)
  timeout_seconds: 15

openvino:
  # local_filter.backend가 "openvino"일 때만 사용됨.
  # "GPU"(Arc iGPU, 7B급 모델도 무난함) | "NPU"(AI Boost, 1~2B급 소형 모델만 안정적)
  # | "CPU" | "AUTO"(OpenVINO가 알아서 선택)
  device: "GPU"
  # scripts/download_openvino_model.py의 기본 저장 경로와 맞춰둔 값.
  # NPU로 쓰려면 1.5B 모델을 받아서 이 경로를 그 폴더로 바꿔줄 것.
  model_path: "models/openvino/qwen2.5-7b-instruct-int4-ov"
  max_new_tokens: 300

stock_matcher:
  # Ollama가 추출한 종목명 후보를 실제 KOSPI/KOSDAQ 상장 종목과 대조하기 위한
  # KRX 전체 종목 목록 캐시 갱신 주기 (시간). 상장/폐지가 매일 일어나는 건
  # 아니므로 짧게 잡을 필요 없음.
  refresh_hours: 24

  # 뉴스에서 흔히 쓰는 약칭/구(舊)상호가 실제 상장명과 문자열상 겹치지 않아
  # 알고리즘(정확일치/부분일치/유사도)만으로는 못 찾는 경우를 위한 수동 별칭 테이블.
  # key: 뉴스에 흔히 쓰이는 이름 -> value: KRX 상장명(정확히 일치해야 함)
  aliases:
    네이버: "NAVER"
    케이티: "KT"
    케이티앤지: "KT&G"
    기아차: "기아"
    기아자동차: "기아"
    # LIG넥스원 -> LIG디펜스앤에어로스페이스로 상호 변경(079550). LLM은 옛 이름을
    # 계속 언급하는 경우가 많아서 별칭으로 매핑해둠.
    LIG넥스원: "LIG디펜스앤에어로스페이스"

    # 제약/바이오 뉴스는 회사명 없이 약물 브랜드명만 나오는 경우가 많은데(예: "케이캡,
    # 시장 점유율 1위"), LLM이 브랜드명->개발사 매핑 지식이 부족해서 후보를 놓치는 걸
    # 실측으로 확인함. 잘 알려진 국내 신약만 시드로 등록 - 확실하지 않은 건 넣지 않는다
    # (틀린 매핑은 엉뚱한 종목을 후보로 올리는 것보다 안 올리는 게 낫다).
    케이캡: "HK이노엔"
    렉라자: "유한양행"
    렉키로나: "셀트리온"
    램시마: "셀트리온"
    트룩시마: "셀트리온"
    허쥬마: "셀트리온"
    유플라이마: "셀트리온"
    로수젯: "한미약품"
    아모잘탄: "한미약품"
    카나브: "보령"
    펙수클루: "대웅제약"
    엔블로: "대웅제약"
    놀텍: "종근당"
    시벡스트로: "동아에스티"
    슈가논: "동아에스티"
    인보사: "코오롱생명과학"
    스카이코비원: "SK바이오사이언스"

analysis:
  # true로 바꾸면 1차 필터를 통과한 뉴스에 대해 아래 backend로 2차 정밀분석을 수행한다.
  # false(기본값)면 1차 필터 결과만으로 후보를 판단한다 - API 비용 없이 로컬에서만 테스트 가능.
  enabled: true
  # "claude" (유료, 사용량 과금) | "gemini" (2.5 Flash 기준 무료 티어 제공 - 분당 10회/
  # 일 500회, 2026년 기준. 단 무료 티어 데이터는 구글이 자사 제품 개선에 활용할 수 있음.
  # .env에 GEMINI_API_KEY 필요 - https://aistudio.google.com/apikey 에서 무료 발급)
  backend: "gemini"
  # 2차 정밀분석 신뢰도 임계값 (이 값 미만이면 후보에서 제외)
  min_confidence: 0.6

claude:
  model: "claude-sonnet-5"
  max_tokens: 1024

gemini:
  # 실측(2026-09-22): 이 API 키로는 "gemini-2.5-flash"가 404("no longer available to
  # new users")를 반환함 - Gemini 라인업이 3.x대로 넘어가면서 신규 키에는 구세대 모델이
  # 막혀 있음. "gemini-flash-latest" 별칭은 현재 내부적으로 "gemini-3.8-flash"를
  # 가리키는데, 이 모델은 무료 티어 한도가 분당 5회로 빡빡하고 503(고수요)도 자주 떠서
  # 오히려 더 불안정했다(4번 호출 중 4번 다 실패: 503 x3, 429 할당량초과 x1). 반면
  # "gemini-3.6-flash"로 명시 고정했을 때는 4번 중 3번 성공 - 그래서 latest 별칭 대신
  # 이 버전에 고정한다. Gemini 라인업이 워낙 빨리 바뀌므로(2026-09-22 기준 3.8까지 나옴)
  # 이 모델도 언젠가 신규 유저에게 막힐 수 있음 - 404가 뜨면 이 파일의 주석 방식대로
  # `client.models.list()`로 사용 가능한 모델을 다시 확인하고 실측 후 교체할 것.
  model: "gemini-3.6-flash"
  max_output_tokens: 1024

ranking:
  # buy_candidate가 동시에 여러 개 나올 때(같은 뉴스에서 여러 종목 / 다른 뉴스에서 각각)
  # 우선순위를 매기기 위해 비교 대상으로 묶을 시간창(분). 이 시간 안에 buy_candidate로
  # 뜬 것들끼리만 비교해서 순위를 매긴다 - 오래된 후보가 계속 1위를 차지하는 것을 막기 위함.
  # 아직 점수 계산 + 로그/콘솔 표시까지만 구현되어 있고, 이 순위로 실제 매매를 자동
  # 결정하지는 않는다(수동 판단 보조용).
  window_minutes: 30

storage:
  sqlite_path: "data/news_pipeline.db"

logging:
  level: "INFO"
  file: "logs/pipeline.log"
